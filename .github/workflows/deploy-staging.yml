name: Deploy UDC staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: udc-staging-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      full_browser: true
    permissions:
      contents: read

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: udc-staging
    permissions:
      contents: read
      id-token: write
    env:
      UDC_STAGING_DEPLOY_ENABLED: ${{ vars.UDC_STAGING_DEPLOY_ENABLED }}
      UDC_AZURE_RESOURCE_GROUP: ${{ vars.UDC_AZURE_RESOURCE_GROUP }}
      UDC_AZURE_WEBAPP_NAME: ${{ vars.UDC_AZURE_WEBAPP_NAME }}
      UDC_ACR_NAME: ${{ vars.UDC_ACR_NAME }}
      UDC_PUBLIC_SITE_URL: ${{ vars.UDC_PUBLIC_SITE_URL }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check deployment prerequisites
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$UDC_STAGING_DEPLOY_ENABLED" != "true" ]]; then
            echo "Staging deployment requires main and explicit UDC staging enablement." >&2
            exit 1
          fi
          if [[ -z "$UDC_AZURE_RESOURCE_GROUP" || -z "$UDC_AZURE_WEBAPP_NAME" || -z "$UDC_ACR_NAME" || -z "$UDC_PUBLIC_SITE_URL" || -z "$AZURE_SUBSCRIPTION_ID" ]]; then
            echo "Configure all required UDC staging variables and subscription ID." >&2
            exit 1
          fi
          node -e 'const u = new URL(process.env.UDC_PUBLIC_SITE_URL); if (u.protocol !== "https:" || u.username || u.password || u.pathname !== "/" || u.search || u.hash) throw new Error("UDC_PUBLIC_SITE_URL must be an HTTPS origin");'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Sign in with UDC federated identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify UDC-owned targets and staging slot
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "$AZURE_SUBSCRIPTION_ID" ]]
          app_tag="$(az webapp show --resource-group "$UDC_AZURE_RESOURCE_GROUP" --name "$UDC_AZURE_WEBAPP_NAME" --query 'tags.application' -o tsv)"
          registry_tag="$(az acr show --resource-group "$UDC_AZURE_RESOURCE_GROUP" --name "$UDC_ACR_NAME" --query 'tags.application' -o tsv)"
          if [[ "$app_tag" != "udc" || "$registry_tag" != "udc" ]]; then
            echo "Both the UDC web app and registry must have the application=udc tag." >&2
            exit 1
          fi
          az webapp show --resource-group "$UDC_AZURE_RESOURCE_GROUP" --name "$UDC_AZURE_WEBAPP_NAME" --slot staging --query id -o tsv > /dev/null
          auto_swap="$(az webapp config show --resource-group "$UDC_AZURE_RESOURCE_GROUP" --name "$UDC_AZURE_WEBAPP_NAME" --slot staging --query autoSwapSlotName -o tsv)"
          if [[ -n "$auto_swap" ]]; then
            echo "Disable staging auto-swap before deploying." >&2
            exit 1
          fi
      - name: Build staging image
        id: build
        run: |
          set -euo pipefail
          registry="$(az acr show --resource-group "$UDC_AZURE_RESOURCE_GROUP" --name "$UDC_ACR_NAME" --query loginServer -o tsv)"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --build-arg "PRODUCTION_SITE_URL=$UDC_PUBLIC_SITE_URL" -t "$registry/udc:$tag" .
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$registry/udc:$tag" >> "$GITHUB_OUTPUT"
      - name: Scan staging image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Publish immutable image
        id: image
        env:
          REGISTRY: ${{ steps.build.outputs.registry }}
          TAG: ${{ steps.build.outputs.tag }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          az acr login --name "$UDC_ACR_NAME"
          docker push "$IMAGE"
          digest="$(az acr repository show --name "$UDC_ACR_NAME" --image "udc:$TAG" --query digest -o tsv)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the published image digest." >&2
            exit 1
          fi
          echo "image=$REGISTRY/udc@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy to UDC staging only
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          az webapp config container set --resource-group "$UDC_AZURE_RESOURCE_GROUP" --name "$UDC_AZURE_WEBAPP_NAME" --slot staging --container-image-name "$IMAGE" --output none
          az webapp restart --resource-group "$UDC_AZURE_RESOURCE_GROUP" --name "$UDC_AZURE_WEBAPP_NAME" --slot staging
          echo "Staging configuration updated. Verify image pull and application health before promotion."
