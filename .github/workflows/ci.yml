name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_browser:
        description: Run the complete Playwright suite
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_browser:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Tests and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: udc_ci
          POSTGRES_PASSWORD: udc_ci_only
          POSTGRES_DB: udc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U udc_ci -d udc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://udc_ci:udc_ci_only@127.0.0.1:5432/udc_ci
      SESSION_SECRET: ci-only-synthetic-session-secret
      NODE_ENV: test
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize disposable database
        id: schema
        run: npm run db:migrate
      - name: Run application tests
        run: npm test
      - name: Run validation route regressions
        run: >-
          npx tsx --test
          server/documentAccountLinks.test.ts
          server/caseDocumentAlerts.test.ts
          server/estateReferral.test.ts
          server/nerSearch.test.ts
          server/relativesSearchSafety.test.ts
          server/registrationAvailability.test.ts
      - name: Run ORSA and migration integration tests
        if: ${{ !cancelled() && steps.schema.outcome == 'success' }}
        env:
          ORSA_WARMUP_DB_TEST: "1"
          WEBHOOK_MIGRATION_DB_TEST: "1"
          BASELINE_DB_TEST: "1"
        run: >-
          npx tsx --test
          server/orsaWarmup.test.ts
          server/orsaWarmupRoutes.test.ts
          server/orsaWarmup.db.test.ts
          server/orsaAccountInvitations.db.test.ts
          server/orsaEmailCampaignRetry.db.test.ts
          server/orsaOutreach.db.test.ts
          server/webhookStatusMigration.db.test.ts
          server/baselineMigration.db.test.ts
      - name: Run startup safety regressions
        env:
          STARTUP_SAFETY_DB_TEST: "1"
        run: npx tsx --test server/startupSafety.db.test.ts

  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  dependency-audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run mocked browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5000
          FULL_BROWSER: ${{ inputs.full_browser }}
        run: |
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5000 --strictPort &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null "$PLAYWRIGHT_BASE_URL/"; then
              ready=true
              break
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              echo "Vite exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Timed out waiting for Vite" >&2
            exit 1
          fi
          if [[ "$FULL_BROWSER" == "true" ]]; then
            npm run test:e2e -- --workers=2
          else
            npm run test:e2e:public-routes -- tests/e2e/certificate-validation.spec.ts
          fi

  container:
    name: Build and scan container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --pull --build-arg PRODUCTION_SITE_URL=https://ci.example.invalid -t udc-ci .
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: udc-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
